<!doctype html>
<html lang="id" data-theme="simppm">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMPPM &mdash; Sistem Informasi Pengelolaan PPM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Terapkan tema tersimpan sebelum aplikasi dimuat agar tidak berkedip
      // (lihat lib/theme.js).
      try {
        var t = localStorage.getItem('simppm.tema');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'simppm-gelap' : 'simppm';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
